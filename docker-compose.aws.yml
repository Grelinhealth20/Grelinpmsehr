# Grelin Health — PMS & EHR · AWS production stack.
# SINGLE PUBLIC SERVICE: the backend IS the edge (COMBINED_EDGE=true) — it terminates TLS, runs the
# WAF + hardened headers + edge rate-limits, serves /api in-process, and reverse-proxies the SPA to the
# frontend container. There is no separate gateway container, no loopback proxy, no rotating internal key.
# TLS cert + key are mounted from ./certs; the pinned DB CA from ./backend/certs.

services:

  # --- 1. OCR — Python document-AI microservice (no deps, start first) ------
  grelin-ehr-pms-ocr:
    image: 285529798033.dkr.ecr.us-east-2.amazonaws.com/grelin-health:grelin_ehr_pms_ocr_latest
    container_name: grelin_ehr_pms_ocr
    restart: always
    expose:
      - "6003"
    environment:
      - OCR_WARMUP=true
      - OCR_API_KEY=${OCR_API_KEY}
    volumes:
      - ocr-paddle:/root/.paddleocr
      - ocr-doctr:/root/.cache/doctr
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:6003/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- 2. Frontend — React SPA served by nginx (private; proxied by backend) --
  grelin-ehr-pms-frontend:
    image: 285529798033.dkr.ecr.us-east-2.amazonaws.com/grelin-health:grelin_ehr_pms_frontend_latest
    container_name: grelin_ehr_pms_frontend
    restart: always
    expose:
      - "6001"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- 3. Backend + EDGE — the SINGLE public service (TLS + WAF + API + SPA proxy) ---
  grelin-ehr-pms-backend:
    image: 285529798033.dkr.ecr.us-east-2.amazonaws.com/grelin-health:grelin_ehr_pms_backend_latest
    container_name: grelin_ehr_pms_backend
    restart: always
    depends_on:
      - grelin-ehr-pms-ocr
      - grelin-ehr-pms-frontend
    # Public edge: host 443→container 6004 (HTTPS) and host 80→container 6002 (HTTP→HTTPS 301).
    # Privileged host ports map to unprivileged container ports (no CAP_NET_BIND_SERVICE needed).
    ports:
      - "443:6004"
      - "80:6002"
    environment:
      # --- Combined edge ---
      - NODE_ENV=production
      - COMBINED_EDGE=true
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=6002            # HTTP (301→HTTPS + /healthz)
      - GATEWAY_HTTPS_PORT=6004      # HTTPS (the public service)
      - GATEWAY_TLS=true
      - GATEWAY_CANONICAL_HOST=pms.grelinhealth.com
      - TLS_CERT_PATH=/app/tls/pms_grelinhealth_fullchain.crt
      - TLS_KEY_PATH=/app/tls/pms_grelinhealth.key
      - TRUST_PROXY=false            # gateway terminates TLS itself (no proxy in front)
      - WAF_BLOCKING=true
      - FRONTEND_ORIGIN=http://grelin-ehr-pms-frontend:6001
      - GATEWAY_ORIGIN=${GATEWAY_ORIGIN}   # https://pms.grelinhealth.com (CORS allowlist)
      # --- Database (MySQL) — PHI traffic over TLS (pinned CA) ---
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-grelin_pmsehr}
      - DB_CONNECTION_LIMIT=25
      - DB_SSL=true
      - DB_SSL_CA=/app/db-certs/db-ca.pem
      - DB_SSL_REJECT_UNAUTHORIZED=true
      # --- Cryptography / JWT ---
      - PHI_ENC_KEY=${PHI_ENC_KEY}
      - BLIND_INDEX_KEY=${BLIND_INDEX_KEY}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ACCESS_TOKEN_TTL=1800
      - REFRESH_TOKEN_TTL=28800
      # --- Security policy ---
      - MAX_FAILED_LOGINS=5
      - ACCOUNT_LOCK_MINUTES=15
      - PASSWORD_MIN_LENGTH=12
      - PASSWORD_HISTORY_SIZE=5
      # --- AWS S3 ---
      - S3_BUCKET=${S3_BUCKET:-pms-ehr}
      - S3_REGION=${S3_REGION:-us-east-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # --- OCR ---
      - OCR_SERVICE_URL=http://grelin-ehr-pms-ocr:6003
      - OCR_API_KEY=${OCR_API_KEY}
      - OCR_TIMEOUT_MS=60000
      # --- Master admin ---
      - MASTER_ADMIN_EMAIL=${MASTER_ADMIN_EMAIL}
      - MASTER_ADMIN_PASSWORD=${MASTER_ADMIN_PASSWORD}
      - MASTER_ADMIN_NAME=${MASTER_ADMIN_NAME:-Master Administrator}
      # --- Stedi ---
      - STEDI_API_KEY=${STEDI_API_KEY}
      - STEDI_BASE_URL=https://healthcare.us.stedi.com/2024-04-01
      - STEDI_TIMEOUT_MS=20000
    volumes:
      - ./certs:/app/tls:ro                # TLS: pms_grelinhealth_fullchain.crt + pms_grelinhealth.key
      - ./backend/certs:/app/db-certs:ro   # pinned DB CA (db-ca.pem)
    # The image's default healthcheck hits API_PORT; in combined mode the service listens on the edge
    # ports, so probe the HTTP listener's /healthz instead.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ocr-paddle:
  ocr-doctr:
