# ============================================================================
# Grelin Health — PMS & EHR  ·  three images, one command
#
#   docker compose up --build -d
#
#   backend   PUBLIC edge — TLS, WAF, CSP, rate limiting, /api in-process,
#             and the SPA reverse-proxy. The ONLY service mapped to the host.
#   frontend  React SPA served by nginx.        private
#   ocr       Python document-AI microservice.  private
#
#            browser
#               │
#               ▼
#      [ backend :6002/:6004  (edge + API) ] ──► [ ocr :6003 ]
#           │ reverse-proxies non-/api
#           ▼
#      [ frontend :6001 ]
#                       └──► external MySQL (DB_* in .env)
#
# The gateway has been folded into the backend (COMBINED_EDGE) — there is no
# separate gateway service. The database is EXTERNAL — details come from .env.
# ============================================================================

services:
  # --- PUBLIC edge = backend (API + WAF + TLS + SPA proxy) -----------------
  backend:
    build:
      context: ./backend
    image: grelin-backend
    restart: unless-stopped
    depends_on:
      - ocr
      - frontend
    env_file:
      - .env
    environment:
      COMBINED_EDGE: "true"
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "6002"          # HTTP  (redirects to HTTPS when GATEWAY_TLS=true)
      GATEWAY_HTTPS_PORT: "6004"    # HTTPS (used when GATEWAY_TLS=true)
      FRONTEND_ORIGIN: http://frontend:6001
      OCR_SERVICE_URL: http://ocr:6003
    ports:
      - "6002:6002"
      - "6004:6004"
    volumes:
      - ./certs:/app/tls:ro                # TLS cert+key (only read when GATEWAY_TLS=true)
      - ./backend/certs:/app/db-certs:ro   # pinned DB CA (db-ca.pem) when DB_SSL=true

  # --- private services (no host port mappings) ----------------------------
  frontend:
    build:
      context: ./frontend
    image: grelin-frontend
    restart: unless-stopped
    expose:
      - "6001"

  ocr:
    build:
      context: ./ocr-service
    image: grelin-ocr
    restart: unless-stopped
    environment:
      OCR_WARMUP: "true"
      OCR_API_KEY: ${OCR_API_KEY:-}
    expose:
      - "6003"
    volumes:
      - ocr-paddle:/root/.paddleocr
      - ocr-doctr:/root/.cache/doctr
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:6003/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  ocr-paddle:
  ocr-doctr:
