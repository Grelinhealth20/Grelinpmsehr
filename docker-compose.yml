# ============================================================================
# Grelin Health — PMS & EHR · AWS Production Stack
#
# Architecture:
#
# Internet
#    │
#    ▼
# Host Nginx (:80 / :443)  <-- Terminates SSL/TLS
#    │
#    ▼  HTTP (127.0.0.1:6002)
# Backend Edge (WAF + API + Rate Limiting)
#    │
#    ├───► Frontend (:6001, private bridge network)
#    │
#    └───► OCR Microservice (:6003, private bridge network)
#
# Database: External MySQL (e.g. AWS RDS or remote instance) configured in .env
# ============================================================================

services:

  # ==========================================================================
  # 1. OCR Microservice (PP-StructureV2 + docTR)
  # ==========================================================================
  grelin-ehr-pms-ocr:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    image: 285529798033.dkr.ecr.us-east-2.amazonaws.com/grelin-health:grelin_ehr_pms_ocr_latest
    container_name: grelin_ehr_pms_ocr
    restart: always
    expose:
      - "6003"
    environment:
      OCR_WARMUP: "true"
      OCR_API_KEY: "${OCR_API_KEY:-}"
    volumes:
      - ocr-paddle:/root/.paddleocr
      - ocr-doctr:/root/.cache/doctr
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6003/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - grelin-ehr-network

  # ==========================================================================
  # 2. Frontend React SPA (Private: proxied by Backend)
  # ==========================================================================
  grelin-ehr-pms-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: 285529798033.dkr.ecr.us-east-2.amazonaws.com/grelin-health:grelin_ehr_pms_frontend_latest
    container_name: grelin_ehr_pms_frontend
    restart: always
    expose:
      - "6001"
    networks:
      - grelin-ehr-network

  # ==========================================================================
  # 3. Backend & Public Edge (WAF + API + SPA reverse proxy)
  # Bound to 127.0.0.1:6002 so it is accessed only through Host Nginx.
  # ==========================================================================
  grelin-ehr-pms-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: 285529798033.dkr.ecr.us-east-2.amazonaws.com/grelin-health:grelin_ehr_pms_backend_latest
    container_name: grelin_ehr_pms_backend
    restart: always
    depends_on:
      grelin-ehr-pms-ocr:
        condition: service_healthy
      grelin-ehr-pms-frontend:
        condition: service_started
    ports:
      - "127.0.0.1:6002:6002"
    environment:

      # --- Application & Edge ---
      NODE_ENV: production
      COMBINED_EDGE: "true"
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "6002"
      GATEWAY_TLS: "false"
      TRUST_PROXY: "true"
      GATEWAY_CANONICAL_HOST: "ehr.grelinhealth.com"
      GATEWAY_ORIGIN: "${GATEWAY_ORIGIN:-https://ehr.grelinhealth.com}"
      FRONTEND_ORIGIN: "http://grelin-ehr-pms-frontend:6001"
      WAF_BLOCKING: "true"

      # --- External Database (MySQL) from .env ---
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-grelin_pmsehr}"
      DB_CONNECTION_LIMIT: "${DB_CONNECTION_LIMIT:-25}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "/app/db-certs/db-ca.pem"
      DB_SSL_REJECT_UNAUTHORIZED: "${DB_SSL_REJECT_UNAUTHORIZED:-false}"

      # --- Cryptography (AES-256-GCM PHI encryption & Blind Index) ---
      PHI_ENC_KEY: "${PHI_ENC_KEY}"
      BLIND_INDEX_KEY: "${BLIND_INDEX_KEY}"

      # --- JWT / Session Authentication ---
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-1800}"
      REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:-28800}"

      # --- Security Policy ---
      MAX_FAILED_LOGINS: "${MAX_FAILED_LOGINS:-5}"
      ACCOUNT_LOCK_MINUTES: "${ACCOUNT_LOCK_MINUTES:-15}"
      PASSWORD_MIN_LENGTH: "${PASSWORD_MIN_LENGTH:-12}"
      PASSWORD_HISTORY_SIZE: "${PASSWORD_HISTORY_SIZE:-5}"

      # --- AWS S3 Document Storage ---
      S3_BUCKET: "${S3_BUCKET:-pms-ehr}"
      S3_REGION: "${S3_REGION:-us-east-2}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"

      # --- OCR Service Integration ---
      OCR_SERVICE_URL: "http://grelin-ehr-pms-ocr:6003"
      OCR_API_KEY: "${OCR_API_KEY:-}"
      OCR_TIMEOUT_MS: "${OCR_TIMEOUT_MS:-60000}"

      # --- Master Admin Seed ---
      MASTER_ADMIN_EMAIL: "${MASTER_ADMIN_EMAIL}"
      MASTER_ADMIN_PASSWORD: "${MASTER_ADMIN_PASSWORD}"
      MASTER_ADMIN_NAME: "${MASTER_ADMIN_NAME:-Master Administrator}"

      # --- External Healthcare APIs ---
      STEDI_API_KEY: "${STEDI_API_KEY:-}"
      STEDI_BASE_URL: "https://healthcare.us.stedi.com/2024-04-01"
      STEDI_TIMEOUT_MS: "${STEDI_TIMEOUT_MS:-20000}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      UMLS_API_KEY: "${UMLS_API_KEY:-}"

    volumes:
      # Pinned DB CA certificate for secure RDS / MySQL TLS
      - ./backend/certs:/app/db-certs:ro

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:6002/api/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - grelin-ehr-network

# ============================================================================
# Networks & Volumes
# ============================================================================

networks:
  grelin-ehr-network:
    name: grelin-ehr-network
    driver: bridge

volumes:
  ocr-paddle:
    name: grelin_ocr_paddle
  ocr-doctr:
    name: grelin_ocr_doctr
