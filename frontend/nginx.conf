# Grelin Health — SPA static server (unprivileged Nginx).
# Private service: reachable only via the internal network. The backend edge reverse-proxies
# browser requests here, so WAF / CSP / rate-limiting apply across all routes.

server {
    listen 6001;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed Vite assets are immutable — cache them for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # History-API fallback: unknown paths return the SPA shell for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML shell must never be cached to ensure users receive asset updates
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Container liveness probe
    location = /_health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"grelin-pms-frontend"}';
    }
}
