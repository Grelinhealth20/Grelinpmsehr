# Grelin Health — SPA static server.
# Private service: only the gateway talks to it. It never faces the internet,
# so security headers (CSP/HSTS/etc.) stay owned by the gateway, which is the
# edge — duplicating them here would risk conflicting policies.

server {
    listen 6001;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed Vite assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # History-API fallback: unknown paths return the SPA shell so client-side
    # routing works on a hard refresh / deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell must never be cached, or clients pin to a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Container liveness probe.
    location = /_health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"grelin-pms-frontend"}';
    }
}
